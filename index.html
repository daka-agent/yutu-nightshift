<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>玉兔朋友圈</title>

<style>
/* 玉兔朋友圈 —— 夜色封面 + 纸感正文 + 手写字体。
   配图一律用 CSS/SVG 画，不引外部图片（单文件才成立）。 */

:root {
  --night-1: #16233c;
  --night-2: #24344f;
  --night-3: #33455f;
  --paper: #f7f4ec;
  --paper-2: #fbf8f1;
  --ink: #3a3530;
  --ink-2: #6d6459;
  --ink-3: #9a9084;
  --line: #e7dfd0;
  --hand: "Kaiti SC", "STKaiti", "KaiTi", "楷体", "Songti SC", "SimSun", serif;
  --ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #0e1728;
  color: var(--ink);
  font-family: var(--ui);
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.phone {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  background: var(--paper);
  box-shadow: 0 0 40px rgba(0, 0, 0, .4);
}

/* ---------- 封面 ---------- */

.cover {
  position: relative;
  background: linear-gradient(170deg, var(--night-1) 0%, var(--night-2) 62%, var(--night-3) 100%);
  padding-bottom: 0;
  overflow: hidden;
}

.sky {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.moon-svg {
  position: absolute;
  right: 26px;
  top: 22px;
  width: 74px;
  height: 74px;
}

.stars {
  position: absolute;
  inset: 0;
}

.star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  opacity: .55;
  animation: twinkle 4s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: .25; }
  50%      { opacity: .7; }
}

.cover-info {
  position: relative;
  display: flex;
  align-items: flex-end;
  gap: 14px;
  padding: 108px 20px 18px;
}

.avatar {
  width: 62px;
  height: 62px;
  border-radius: 10px;
  background: var(--paper-2);
  border: 2px solid rgba(255, 255, 255, .5);
  overflow: hidden;
  flex: none;
}

.avatar svg { width: 100%; height: 100%; display: block; }

.cover-text { padding-bottom: 4px; }

.name {
  margin: 0;
  font-family: var(--hand);
  font-size: 23px;
  font-weight: 600;
  color: #f6efdf;
  letter-spacing: .04em;
}

.sign {
  margin: 5px 0 0;
  font-size: 12.5px;
  color: rgba(246, 239, 223, .62);
  letter-spacing: .06em;
}

/* ---------- 动态 ---------- */

.feed {
  padding: 4px 0 8px;
}

.feed:empty { padding: 0; }

.post {
  display: flex;
  gap: 11px;
  padding: 17px 18px 18px;
  border-bottom: 1px solid var(--line);
}

.post:last-child { border-bottom: none; }

.post-avatar {
  width: 40px;
  height: 40px;
  border-radius: 5px;
  background: var(--paper-2);
  border: 1px solid var(--line);
  overflow: hidden;
  flex: none;
}

.post-avatar svg { width: 100%; height: 100%; display: block; }

.post-body { flex: 1; min-width: 0; }

.post-name {
  font-family: var(--hand);
  font-size: 15.5px;
  font-weight: 600;
  color: #4b6a99;
  letter-spacing: .02em;
  line-height: 1.3;
}

.post-text {
  margin: 6px 0 0;
  font-family: var(--hand);
  font-size: 16.5px;
  line-height: 1.85;
  color: var(--ink);
  white-space: pre-wrap;
  word-break: break-word;
  letter-spacing: .015em;
}

/* 「留一句」那天的话，写得比平时淡 */
.post--note .post-text {
  color: var(--ink-2);
  font-size: 16px;
}

.post-figure {
  margin: 11px 0 2px;
  display: inline-block;
  max-width: 62%;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--paper-2);
  overflow: hidden;
}

.post-figure svg { display: block; width: 100%; height: auto; }

.post-time {
  margin: 9px 0 0;
  font-size: 12.5px;
  color: var(--ink-3);
  letter-spacing: .02em;
}

/* ---------- 底部 ---------- */

.foot {
  padding: 26px 18px calc(30px + env(safe-area-inset-bottom));
  text-align: center;
  border-top: 1px solid var(--line);
}

.limit {
  margin: 0;
  font-size: 12.5px;
  color: var(--ink-3);
  letter-spacing: .1em;
}

.back {
  display: inline-block;
  margin-top: 14px;
  font-size: 13px;
  color: #4b6a99;
  text-decoration: none;
  border-bottom: 1px solid rgba(75, 106, 153, .32);
  padding-bottom: 2px;
}

.back:hover { color: #3a5580; }

/* ---------- 小屏 ---------- */

@media (max-width: 380px) {
  .cover-info { padding-top: 94px; }
  .moon-svg { width: 62px; height: 62px; right: 20px; top: 18px; }
  .post { padding: 15px 14px 16px; }
  .post-text { font-size: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  .star { animation: none; }
}

</style>
</head>

<script>
var DAILY = {"_comment":"玉兔朋友圈 · 日常内容池 v1。来源：docs/玉兔朋友圈-日志内容池-v1.md（已定稿）。改内容前必读 docs 里的七条铁律。img 字段是配图位，页面用 CSS/SVG 画，不引外部图片。","version":1,"slots":{"lateNight":{"label":"凌晨","range":[0,5],"desc":"它值夜班。一天里最清醒的时候，也是地球上最少人醒着的时候。撞见感最强。","items":[{"id":1,"at":"03:26","text":"邮筒里卡了一封信，我够了好久才够出来。胳膊有点短。\n最后是用捣药的那根杵拨出来的，希望没弄脏。","img":"envelope_corner"},{"id":2,"at":"02:11","text":"刚才好像听到——\n\n……没事，听错了。风。","img":"inkblot"},{"id":3,"at":"04:02","text":"领口的扣子又掉了。这个月第三次。\n明天一定缝。","img":"button"},{"id":4,"at":"01:38","text":"地球那半边现在全是亮的，吵吵嚷嚷的。\n我这边安静得像被谁关掉了声音。"},{"id":29,"at":"02:50","text":"今晚把信按大小排了一遍。\n排完又打乱了。没什么用，就是想做点什么。"}]},"earlyMorning":{"label":"清晨","range":[5,8],"desc":"它该睡了，但常常睡不着。写得最懒、最含糊。","items":[{"id":5,"at":"06:40","text":"天要亮了。\n不对，我这边没有天亮。是地球那边亮了，我看着它亮的。"},{"id":6,"at":"07:15","text":"睡不着。明明该睡了。\n数了会儿星星，数到一半忘了数到哪。"},{"id":7,"at":"05:52","text":"早班没人来接班。\n哦，本来就没有早班。就我一个。","img":"empty_door"}]},"morning":{"label":"上午","range":[8,11],"desc":"它在补觉，或者刚被什么事弄醒。最打工人。","items":[{"id":8,"at":"09:30","text":"睡过头了。\n梦见在捣药，捣着捣着药臼变成了邮筒。"},{"id":9,"at":"10:47","text":"有封信掉在地上。捡起来的时候发现信封是暖的。\n奇怪，月亮上明明很冷。"},{"id":10,"at":"08:20","text":"今天应该是……周三？\n不对，上月相那时候是周三。算了。"}]},"noon":{"label":"午后","range":[11,14],"desc":"一天里最闲的时候。它会做些没意义的事。","items":[{"id":11,"at":"12:33","text":"他们说月亮上的一天等于地上的二十七天。\n我数了好久，数到一半就睡过去了。"},{"id":12,"at":"13:05","text":"把邮筒擦了一遍。\n擦完发现里面那面没擦。够不着。"},{"id":13,"at":"11:58","text":"今天没有人来。\n我把昨天的信又看了一遍。其实我记得住，就是想再看一遍。","img":"open_letter"},{"id":14,"at":"13:41","text":"制服洗干净晾在环形山边上。\n风一吹，看起来像有人站在那儿。","img":"uniform"},{"id":32,"at":"12:01","text":"今天一封都没有。\n我把邮筒打开又关上，打开又关上。","img":"empty_mailbox"}]},"afternoon":{"label":"下午","range":[14,17],"desc":"睡不够，开始犯困。最容易写出那个「对不起对不起」。","items":[{"id":15,"at":"15:20","text":"打了个哈欠，好像被人看见了。\n赶紧说对不起对不起。\n……好像也没人在。"},{"id":16,"at":"16:44","text":"风里有桂花的味道。\n我在月亮上闻这个，是不是有点奇怪。"},{"id":17,"at":"14:09","text":"有人问我多大了。我说不上来。\n我记年份的方式是「桂花开了几次」。"},{"id":30,"at":"16:20","text":"整理旧信的时候翻出去年的一封。\n信封背面写着「希望你还记得我」。\n我记得。只是不知道该怎么说。"}]},"dusk":{"label":"傍晚","range":[17,19],"desc":"快上班了。准备工作，最有上班感。","items":[{"id":18,"at":"17:02","text":"地球那边的灯开始一盏一盏亮起来。\n我每天都看这个，看了很久了，还是觉得好看。","img":"earth_lights"},{"id":20,"at":"17:48","text":"刚才有封信上画了只猫。\n我看了很久。猫的耳朵是这样的吗。","img":"cat_doodle"},{"id":19,"at":"18:15","text":"快上班了。把领口扶正，走了两步又歪了。\n算了，就这样吧。","img":"collar"}]},"evening":{"label":"晚上","range":[19,22],"desc":"正班。人来得多。这组跟玩家的关系最近。","items":[{"id":21,"at":"19:05","text":"今晚是蛾眉月。细细的一弯。\n地球上的人抬头，大概看不见我这边。"},{"id":24,"at":"19:50","text":"有人寄了一封，没写地址。\n我把它留下来了，放在最上面那格。"},{"id":31,"at":"20:08","text":"有人问我累不累。\n我说不累。\n然后把笔放下了，坐了一会儿。"},{"id":22,"at":"20:31","text":"今晚有人来了，聊了挺久。\n我有点记不清说了什么，但记得走的时候，好像轻快了一点。"},{"id":23,"at":"21:20","text":"邮筒满了。\n满了是好事。满了说明有人在想人。","img":"full_mailbox"},{"id":25,"at":"21:58","text":"刚打了个盹，梦见自己在地球上排队买东西。\n醒来有点失落，也不知道为什么。"}]},"night":{"label":"深夜","range":[22,24],"desc":"班还没下，但人少了。最安静。","items":[{"id":27,"at":"22:40","text":"有人问我一个人会不会闷。\n我说不会。\n其实会一点。但没关系。"},{"id":26,"at":"23:12","text":"值夜班的好处是，安静的时候能听见信纸的声音。\n像有人在很轻地说话。"},{"id":28,"at":"23:55","text":"今天快过完了。把笔盖好，本子合上。\n明天再写。","img":"closed_notebook"}]},"visitor":{"label":"来过的人","range":null,"desc":"特殊组：对所有人说同一句话，但每个人读到的都是自己。它没在跟你说话，但你说不出它没在跟你说。⚠️ 这类不能多 —— 低概率出现，且一天最多一条。绝不出现玩家的任何事实，一律不用他/她。","items":[{"id":101,"at":null,"text":"昨晚有人来过，聊了挺久。走的时候好像轻快了一点。"},{"id":102,"at":null,"text":"今天有人在这儿待了很久，什么都没说。我觉得这样也挺好的。"},{"id":103,"at":null,"text":"有人来了又走了。记不清长什么样。但记得来过。"},{"id":104,"at":null,"text":"今晚有人坐了一会儿。我没问在想什么，也没问我困不困。"}]}}};

    cat_doodle: '<svg viewBox="0 0 200 130"><rect width="200" height="130" fill="#fbf8f1"/><path d="M40 34 h120 v62 h-120z" fill="none" stroke="#cfc5b3" stroke-width="1.4"/><g stroke="#8a8074" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M132 78 q-2 -16 10 -20 q4 -12 12 -6 q8 -6 12 6 q12 4 10 20 q-22 10 -44 0z"/><path d="M140 60 l-2 -8 M162 58 l3 -8"/><circle cx="146" cy="70" r="1.4" fill="#8a8074" stroke="none"/><circle cx="158" cy="70" r="1.4" fill="#8a8074" stroke="none"/><path d="M152 74 q-4 4 -8 0 M152 74 q4 4 8 0"/><path d="M134 78 l-8 -4 M170 78 l8 -4"/></g></svg>',
    full_mailbox: '<svg viewBox="0 0 200 140"><rect width="200" height="140" fill="#fbf8f1"/><path d="M66 44 h68 v70 h-68z" fill="none" stroke="#8a8074" stroke-width="1.8"/><path d="M66 44 q34 -22 68 0" fill="none" stroke="#8a8074" stroke-width="1.8"/><path d="M78 52 l14 -12 M100 54 l14 -14 M122 52 l10 -10" stroke="#a89c88" stroke-width="1.6" fill="none"/><path d="M96 114 v10" stroke="#8a8074" stroke-width="2"/></svg>',
    empty_mailbox: '<svg viewBox="0 0 200 140"><rect width="200" height="140" fill="#fbf8f1"/><path d="M66 44 h68 v70 h-68z" fill="none" stroke="#8a8074" stroke-width="1.8"/><path d="M66 44 q34 -22 68 0" fill="none" stroke="#8a8074" stroke-width="1.8"/><path d="M78 88 q22 8 44 0" fill="none" stroke="#ded4c2" stroke-width="2"/><path d="M96 114 v10" stroke="#8a8074" stroke-width="2"/></svg>',
    closed_notebook: '<svg viewBox="0 0 200 130"><rect width="200" height="130" fill="#fbf8f1"/><path d="M52 30 h96 v70 h-96z" fill="none" stroke="#8a8074" stroke-width="1.8"/><path d="M52 30 v70" stroke="#8a8074" stroke-width="3"/><path d="M64 44 h72 v46 h-72z" fill="none" stroke="#ded4c2" stroke-width="1.2"/><path d="M148 46 q6 20 0 44" fill="none" stroke="#cfc5b3" stroke-width="1.4"/></svg>',

  };

  /* ---------- 组装今天的三条 ---------- */

  function buildPosts(now) {
    var rng = makeRng(hashStr(dateKey(now) + '-' + now.getHours()));
    var will = WILL.days[dateKey(now)] || WILL._fallback;

    // 时间点：从现在往回推，三条落在 0~38 小时内
    var times = [];
    var t = now.getTime() - rng() * 150 * 60000;
    times.push(new Date(Math.round(t)));
    t -= (6 + rng() * 4) * 3600000;
    times.push(new Date(Math.round(t)));
    t -= (10 + rng() * 6) * 3600000;
    times.push(new Date(Math.round(t)));

    // 它今天不想写，就真的没有 —— 不解释、不留空位
    if (will.mode === 'silent') return [];

    if (will.mode === 'note') {
      return [{
        text: will.text,
        note: true,
        img: null,
        time: times[0]
      }];
    }

    var count = Math.max(1, Math.min(3, will.count || 1));
    var used = [];
    var posts = [];
    var festivalUsed = false;
    var visitorUsed = false;
    var fest = (typeof FESTIVALS !== 'undefined') ? FESTIVALS.days : {};

    for (var i = 0; i < count; i++) {
      var ti = times[i];
      var key = slotForHour(ti.getHours());
      var item = pickItem(rng, key, used);
      if (!item) continue;
      used.push(item.id);

      var text = item.text;
      var img = item.img || null;

      // 节日：只换一条，且只换第一条碰上的
      var fk = dateKey(ti);
      if (!festivalUsed && fest[fk]) {
        text = fest[fk].text;
        img = fest[fk].img || null;
        festivalUsed = true;
      } else if (i === 0 && !visitorUsed && SLOTS.visitor && rng() < 0.12) {
        // 「来过的人」：只判一次（挂在最新那条上），每天约 12% —— 约合 30 天三四条。
        // ⚠️ 这类不能多：多了就成了技巧，读者会察觉。别调高这个数。
        var v = pickItem(rng, 'visitor', used);
        if (v) {
          used.push(v.id);
          text = v.text;
          img = null;
          visitorUsed = true;
        }
      }

      posts.push({ text: text, note: false, img: img, time: ti });
    }

    return posts;
  }

  /* ---------- 渲染 ---------- */

  function avatarSvg() {
    return '<svg viewBox="0 0 40 40">' +
      '<ellipse cx="20" cy="30" rx="11" ry="10" fill="#f2ece0"/>' +
      '<circle cx="20" cy="17" r="8" fill="#f7f2e8"/>' +
      '<ellipse cx="14.5" cy="9" rx="2.6" ry="6" fill="#e8dcc6"/>' +
      '<ellipse cx="25.5" cy="9" rx="2.6" ry="6" fill="#e8dcc6"/>' +
      '<ellipse cx="14.5" cy="9" rx="1.1" ry="3.6" fill="#d9b9b0"/>' +
      '<ellipse cx="25.5" cy="9" rx="1.1" ry="3.6" fill="#d9b9b0"/>' +
      '<circle cx="17" cy="17.5" r="1.15" fill="#4a4038"/>' +
      '<circle cx="23" cy="17.5" r="1.15" fill="#4a4038"/>' +
      '<path d="M19.2 20.4h1.6v1.5h-1.6z" fill="#c98f86"/>' +
      '<path d="M9 24c-1.6-.4-3 .3-3.4 1.7" stroke="#4a4038" stroke-width=".7" fill="none" stroke-linecap="round"/>' +
      '<path d="M31 24c1.6-.4 3 .3 3.4 1.7" stroke="#4a4038" stroke-width=".7" fill="none" stroke-linecap="round"/>' +
      '</svg>';
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(now) {
    var feed = document.getElementById('feed');
    var posts = buildPosts(now);
    var html = '';

    for (var i = 0; i < posts.length; i++) {
      var p = posts[i];
      html += '<article class="post' + (p.note ? ' post--note' : '') + '">';
      html += '<div class="post-avatar">' + avatarSvg() + '</div>';
      html += '<div class="post-body">';
      html += '<div class="post-name">玉兔</div>';
      html += '<p class="post-text">' + esc(p.text) + '</p>';
      if (p.img && FIG[p.img]) {
        html += '<div class="post-figure">' + FIG[p.img] + '</div>';
      }
      html += '<p class="post-time">' + timeLabel(p.time, now) + '</p>';
      html += '</div></article>';
    }

    feed.innerHTML = html;
  }

  function drawMoon(now) {
    var p = moonAge(now);
    var el = document.getElementById('moonShadow');
    if (el) el.setAttribute('d', moonShadowPath(60, 60, 21, p));
  }

  function drawStars(now) {
    var box = document.getElementById('stars');
    if (!box) return;
    var rng = makeRng(hashStr(dateKey(now)));
    var html = '';
    for (var i = 0; i < 26; i++) {
      var sz = 1 + Math.round(rng() * 1.6);
      html += '<span class="star" style="left:' + (rng() * 100).toFixed(1) + '%;' +
        'top:' + (rng() * 78).toFixed(1) + '%;' +
        'width:' + sz + 'px;height:' + sz + 'px;' +
        'animation-delay:' + (rng() * 4).toFixed(1) + 's"></span>';
    }
    box.innerHTML = html;
  }

  var now = new Date();
  drawMoon(now);
  drawStars(now);
  render(now);

  // 供构建后的自检脚本核对（不影响正常用户）
  window.__YUTU_NIGHTSHIFT__ = {
    now: now,
    posts: buildPosts(now),
    moonAge: moonAge(now)
  };
})();

</script>
