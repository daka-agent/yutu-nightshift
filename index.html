<style>
/* 玉兔朋友圈 —— 夜色封面 + 纸感正文 + 手写字体。
   配图一律用 CSS/SVG 画，不引外部图片（单文件才成立）。 */

:root {
  --night-1: #16233c;
  --night-2: #24344f;
  --night-3: #33455f;
  --paper: #f7f4ec;
  --paper-2: #fbf8f1;
  --ink: #3a3530;
  --ink-2: #6d6459;
  --ink-3: #9a9084;
  --line: #e7dfd0;
  --hand: "Kaiti SC", "STKaiti", "KaiTi", "楷体", "Songti SC", "SimSun", serif;
  --ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #0e1728;
  color: var(--ink);
  font-family: var(--ui);
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.phone {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  background: var(--paper);
  box-shadow: 0 0 40px rgba(0, 0, 0, .4);
}

/* ---------- 封面 ---------- */

.cover {
  position: relative;
  background: linear-gradient(170deg, var(--night-1) 0%, var(--night-2) 62%, var(--night-3) 100%);
  padding-bottom: 0;
  overflow: hidden;
}

.sky {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.moon-svg {
  position: absolute;
  right: 26px;
  top: 22px;
  width: 74px;
  height: 74px;
}

.stars {
  position: absolute;
  inset: 0;
}

.star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  opacity: .55;
  animation: twinkle 4s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: .25; }
  50%      { opacity: .7; }
}

.cover-info {
  position: relative;
  display: flex;
  align-items: flex-end;
  gap: 14px;
  padding: 108px 20px 18px;
}

.avatar {
  width: 62px;
  height: 62px;
  border-radius: 10px;
  background: var(--paper-2);
  border: 2px solid rgba(255, 255, 255, .5);
  overflow: hidden;
  flex: none;
}

.avatar svg { width: 100%; height: 100%; display: block; }

.cover-text { padding-bottom: 4px; }

.name {
  margin: 0;
  font-family: var(--hand);
  font-size: 23px;
  font-weight: 600;
  color: #f6efdf;
  letter-spacing: .04em;
}

.sign {
  margin: 5px 0 0;
  font-size: 12.5px;
  color: rgba(246, 239, 223, .62);
  letter-spacing: .06em;
}

/* ---------- 动态 ---------- */

.feed {
  padding: 4px 0 8px;
}

.feed:empty { padding: 0; }

.post {
  display: flex;
  gap: 11px;
  padding: 17px 18px 18px;
  border-bottom: 1px solid var(--line);
}

.post:last-child { border-bottom: none; }

.post-avatar {
  width: 40px;
  height: 40px;
  border-radius: 5px;
  background: var(--paper-2);
  border: 1px solid var(--line);
  overflow: hidden;
  flex: none;
}

.post-avatar svg { width: 100%; height: 100%; display: block; }

.post-body { flex: 1; min-width: 0; }

.post-name {
  font-family: var(--hand);
  font-size: 15.5px;
  font-weight: 600;
  color: #4b6a99;
  letter-spacing: .02em;
  line-height: 1.3;
}

.post-text {
  margin: 6px 0 0;
  font-family: var(--hand);
  font-size: 16.5px;
  line-height: 1.85;
  color: var(--ink);
  white-space: pre-wrap;
  word-break: break-word;
  letter-spacing: .015em;
}

/* 「留一句」那天的话，写得比平时淡 */
.post--note .post-text {
  color: var(--ink-2);
  font-size: 16px;
}

.post-figure {
  margin: 11px 0 2px;
  display: inline-block;
  max-width: 62%;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--paper-2);
  overflow: hidden;
}

.post-figure svg { display: block; width: 100%; height: auto; }

.post-time {
  margin: 9px 0 0;
  font-size: 12.5px;
  color: var(--ink-3);
  letter-spacing: .02em;
}

/* ---------- 底部 ---------- */

.foot {
  padding: 26px 18px calc(30px + env(safe-area-inset-bottom));
  text-align: center;
  border-top: 1px solid var(--line);
}

.limit {
  margin: 0;
  font-size: 12.5px;
  color: var(--ink-3);
  letter-spacing: .1em;
}

.back {
  display: inline-block;
  margin-top: 14px;
  font-size: 13px;
  color: #4b6a99;
  text-decoration: none;
  border-bottom: 1px solid rgba(75, 106, 153, .32);
  padding-bottom: 2px;
}

.back:hover { color: #3a5580; }

/* ---------- 小屏 ---------- */

@media (max-width: 380px) {
  .cover-info { padding-top: 94px; }
  .moon-svg { width: 62px; height: 62px; right: 20px; top: 18px; }
  .post { padding: 15px 14px 16px; }
  .post-text { font-size: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  .star { animation: none; }
}

</style>
</head>

<script>
/* 玉兔朋友圈 · 核心逻辑
 *
 * ⚠️ 页面是纯静态的：不跑模型、不读 localStorage、不读 Cache Storage、不联网。
 *    所有人看到的都是同一条 —— 这是刻意的（活人的朋友圈就是这样）。
 *
 * 数据由 build/build.py 内联进单文件：LOG（按日归档）。
 *
 * 🔑 「三天可见」是怎么成立的：
 *    每一天在 LOG.days 里有自己的档案 —— 它那天真的写下的东西，0~2 条，各带时刻。
 *    页面把今天 / 昨天 / 前天三份档案合起来，按时间倒序显示。
 *    条数不固定，有时候一条都没有；那不是故障，是它那三天没说话。
 *
 * ⚠️ 以前不是这样：那时只读「今天」的意志、一次性造 1~3 条，再把时间戳往前
 *    贴成三天 —— 三条都是打开页面那一刻出生的，所谓三天只是三个倒贴的标签。
 *    现在每一天有自己的档案，改这个之前先想清楚别走回去了。
 */

(function () {

  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function makeRng(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  /* ---------- 月相 ----------
   * 基准朔：2026-01-19 03:52（香港天文台）。周期取 29.53 天。
   * 明暗界线是半椭圆弧 —— 不能用直线硬切，那是硬伤（月亮邮局踩过）。
   */
  var SYNODIC = 29.53;
  var NEW_MOON_BASE = Date.UTC(2026, 0, 19, 3, 52) - 8 * 3600 * 1000; // 北京时间

  function moonAge(now) {
    var days = (now.getTime() - NEW_MOON_BASE) / 86400000;
    var p = days / SYNODIC;
    return p - Math.floor(p);
  }

  // 返回月亮暗部的 path（画在亮圆之上）
  //
  // ⚠️ outer 必须是 waxing ? 0 : 1。写成 1 : 0 会整体反过来：
  //    遮住的是那条小月牙（面积 = 照亮比例，而不是 1-照亮比例），
  //    盈月的亮面还会跑到左边 —— 北半球看上弦月，亮面在右。
  //    这个错法肉眼看不出来（月牙还是月牙），得量面积和质心才发现。
  function moonShadowPath(cx, cy, r, p) {
    var ang = 2 * Math.PI * p;
    var cosA = Math.cos(ang);
    var k = (1 - cosA) / 2;              // 照亮比例
    var a = Math.abs(cosA) * r;          // 明暗界线椭圆的半宽
    var waxing = p < 0.5;
    var outer = waxing ? 0 : 1;          // 外圆走哪半
    var back = (waxing !== (k < 0.5)) ? 1 : 0; // 回程弧走哪半
    var rx = Math.max(a, 0.01);
    return 'M' + cx + ',' + (cy - r) +
      'A' + r + ',' + r + ' 0 0 ' + outer + ' ' + cx + ',' + (cy + r) +
      'A' + rx + ',' + r + ' 0 0 ' + back + ' ' + cx + ',' + (cy - r) + 'Z';
  }

  /* ---------- 时间 ---------- */

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  // 注：以前这里有个 hhmm()，给「昨天 16:20」拼时分用的。按微信列表页规则改完后
  // 已经没人用它了 —— 如果哪天真要做「点进单条看详情」，详情页才需要时分。
  function dateKey(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function dayDiff(a, b) {
    var x = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    var y = new Date(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((y - x) / 86400000);
  }

  /* 时间标记 —— 严格照微信朋友圈【列表页】的规则（业界叫「统计计时法」）
   *
   *   刚刚（<1分钟） · X分钟前（<1小时） · X小时前（<24小时） · 昨天 · N天前
   *
   * ⚠️ 三个必须守住的点（都是「一眼不像微信」的地方）：
   *   1. 「昨天」就是两个字，**不带时分**。写成「昨天 16:20」是微信【详情页】的
   *      写法（定时计时法），也不是微博的 —— 列表页里出现时分，一眼就假。
   *   2. 「N天前」用阿拉伯数字：是「2天前」，不是「两天前」。
   *   3. 超过 48 小时**不显示「M月D日」**，微信一直数到「N天前」。
   *      我们的三条从 24~36 小时往回推，本来也就不该走到这个分支。
   */
  function timeLabel(t, now) {
    var min = Math.floor((now - t) / 60000);
    if (min < 1) return '刚刚';
    if (min < 60) return min + '分钟前';
    if (min < 1440) return Math.floor(min / 60) + '小时前';
    var dd = dayDiff(t, now);
    if (dd <= 1) return '昨天';
    return dd + '天前';
  }

    empty_mailbox: '<svg viewBox="0 0 200 140"><rect width="200" height="140" fill="#fbf8f1"/><path d="M66 44 h68 v70 h-68z" fill="none" stroke="#8a8074" stroke-width="1.8"/><path d="M66 44 q34 -22 68 0" fill="none" stroke="#8a8074" stroke-width="1.8"/><path d="M78 88 q22 8 44 0" fill="none" stroke="#ded4c2" stroke-width="2"/><path d="M96 114 v10" stroke="#8a8074" stroke-width="2"/></svg>',
    closed_notebook: '<svg viewBox="0 0 200 130"><rect width="200" height="130" fill="#fbf8f1"/><path d="M52 30 h96 v70 h-96z" fill="none" stroke="#8a8074" stroke-width="1.8"/><path d="M52 30 v70" stroke="#8a8074" stroke-width="3"/><path d="M64 44 h72 v46 h-72z" fill="none" stroke="#ded4c2" stroke-width="1.2"/><path d="M148 46 q6 20 0 44" fill="none" stroke="#cfc5b3" stroke-width="1.4"/></svg>',
    earth_from_moon: '<svg viewBox="0 0 200 140"><rect width="200" height="140" fill="#fbf8f1"/><circle cx="100" cy="70" r="40" fill="#4b6a99" fill-opacity=".26"/><circle cx="100" cy="70" r="40" fill="none" stroke="#4b6a99" stroke-width="1.5" stroke-opacity=".6"/><path d="M70 52 q16 10 30 4 q14 -6 26 6" stroke="#8fae7a" stroke-width="1.6" fill="none" stroke-opacity=".7"/><path d="M78 88 q18 -8 34 2 q10 6 14 0" stroke="#8fae7a" stroke-width="1.4" fill="none" stroke-opacity=".6"/><g fill="#f0c96a"><circle cx="88" cy="62" r="1.5"/><circle cx="112" cy="76" r="1.3"/><circle cx="104" cy="56" r="1.2"/></g></svg>'
  };

  /* ---------- 把最近三天的档案合起来 ---------- */

  function collectPosts(now) {
    var out = [];
    var base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var nowMs = now.getTime();

    for (var back = 0; back < 3; back++) {
      var d = new Date(base.getTime());
      d.setDate(d.getDate() - back);

      var day = LOG.days[dateKey(d)];
      if (!day || !day.posts) continue;   // 那天没有档案 = 它没写。这不是故障。

      for (var i = 0; i < day.posts.length; i++) {
        var p = day.posts[i];
        var parts = String(p.t || '00:00').split(':');
        var ts = new Date(
          d.getFullYear(), d.getMonth(), d.getDate(),
          parseInt(parts[0], 10) || 0,
          parseInt(parts[1], 10) || 0
        );
        // 🔑 玉兔还没写到那个点，你就不该看见。
        //    它 21:30 那条，你早上八点打开是不存在的；晚上再来，它就在了。
        //    「撞见」这件事全靠这一行 —— 它不是等你打开才写的。
        if (ts.getTime() > nowMs) continue;
        out.push({ text: p.text, note: !!p.note, img: p.img || null, time: ts });
      }
    }

    out.sort(function (a, b) { return b.time - a.time; }); // 新的在上
    return out;
  }

  /* ---------- 渲染 ---------- */

  function avatarSvg() {
    return '<svg viewBox="0 0 40 40">' +
      '<ellipse cx="20" cy="30" rx="11" ry="10" fill="#f2ece0"/>' +
      '<circle cx="20" cy="17" r="8" fill="#f7f2e8"/>' +
      '<ellipse cx="14.5" cy="9" rx="2.6" ry="6" fill="#e8dcc6"/>' +
      '<ellipse cx="25.5" cy="9" rx="2.6" ry="6" fill="#e8dcc6"/>' +
      '<ellipse cx="14.5" cy="9" rx="1.1" ry="3.6" fill="#d9b9b0"/>' +
      '<ellipse cx="25.5" cy="9" rx="1.1" ry="3.6" fill="#d9b9b0"/>' +
      '<circle cx="17" cy="17.5" r="1.15" fill="#4a4038"/>' +
      '<circle cx="23" cy="17.5" r="1.15" fill="#4a4038"/>' +
      '<path d="M19.2 20.4h1.6v1.5h-1.6z" fill="#c98f86"/>' +
      '<path d="M9 24c-1.6-.4-3 .3-3.4 1.7" stroke="#4a4038" stroke-width=".7" fill="none" stroke-linecap="round"/>' +
      '<path d="M31 24c1.6-.4 3 .3 3.4 1.7" stroke="#4a4038" stroke-width=".7" fill="none" stroke-linecap="round"/>' +
      '</svg>';
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(now) {
    var feed = document.getElementById('feed');
    var posts = collectPosts(now);
    var html = '';

    for (var i = 0; i < posts.length; i++) {
      var p = posts[i];
      html += '<article class="post' + (p.note ? ' post--note' : '') + '">';
      html += '<div class="post-avatar">' + avatarSvg() + '</div>';
      html += '<div class="post-body">';
      html += '<div class="post-name">玉兔</div>';
      html += '<p class="post-text">' + esc(p.text) + '</p>';
      if (p.img && FIG[p.img]) {
        html += '<div class="post-figure">' + FIG[p.img] + '</div>';
      }
      html += '<p class="post-time">' + timeLabel(p.time, now) + '</p>';
      html += '</div></article>';
    }

    feed.innerHTML = html;
  }

  function drawMoon(now) {
    var p = moonAge(now);
    var el = document.getElementById('moonShadow');
    if (el) el.setAttribute('d', moonShadowPath(60, 60, 21, p));
  }

  function drawStars(now) {
    var box = document.getElementById('stars');
    if (!box) return;
    var rng = makeRng(hashStr(dateKey(now)));
    var html = '';
    for (var i = 0; i < 26; i++) {
      var sz = 1 + Math.round(rng() * 1.6);
      html += '<span class="star" style="left:' + (rng() * 100).toFixed(1) + '%;' +
        'top:' + (rng() * 78).toFixed(1) + '%;' +
        'width:' + sz + 'px;height:' + sz + 'px;' +
        'animation-delay:' + (rng() * 4).toFixed(1) + 's"></span>';
    }
    box.innerHTML = html;
  }

  var now = new Date();
  drawMoon(now);
  drawStars(now);
  render(now);

  // 供构建后的自检脚本核对（不影响正常用户）
  window.__YUTU_NIGHTSHIFT__ = {
    now: now,
    posts: collectPosts(now),
    moonAge: moonAge(now)
  };
})();

</script>
